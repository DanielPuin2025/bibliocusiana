<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Sistema Biblioteca</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .test { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔧 Test del Sistema de Biblioteca</h1>

    <div class="test">
        <h2>1. Test de JavaScript</h2>
        <button onclick="testJS()">Probar JavaScript</button>
        <div id="result-js"></div>
    </div>

    <div class="test">
        <h2>2. Test de API</h2>
        <button onclick="testAPI()">Probar API de Libros</button>
        <div id="result-api"></div>
    </div>

    <div class="test">
        <h2>3. Test de Base de Datos</h2>
        <button onclick="testDB()">Probar Conexión BD</button>
        <div id="result-db"></div>
    </div>

    <div class="test">
        <h2>4. Ir al Sistema</h2>
        <a href="frontend/index.html"><button style="background: #4CAF50; color: white; font-size: 16px;">🚀 Abrir Sistema de Biblioteca</button></a>
    </div>

    <script>
        function testJS() {
            const result = document.getElementById('result-js');
            result.innerHTML = '<p class="success">✅ JavaScript funciona correctamente</p>';
        }

        async function testAPI() {
            const result = document.getElementById('result-api');
            result.innerHTML = '<p>Cargando...</p>';

            try {
                const response = await fetch('backend/api/obtener_libros.php');
                const data = await response.json();

                if (data.status === 'success') {
                    result.innerHTML = `<p class="success">✅ API funciona - ${data.libros.length} libros encontrados</p>`;
                } else {
                    result.innerHTML = `<p class="error">❌ Error: ${data.message}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error de conexión: ${error.message}</p>`;
            }
        }

        async function testDB() {
            const result = document.getElementById('result-db');
            result.innerHTML = '<p>Cargando...</p>';

            try {
                const response = await fetch('test_libros.php');
                const data = await response.json();

                if (data.error) {
                    result.innerHTML = `<p class="error">❌ Error BD: ${data.error}</p>`;
                } else {
                    result.innerHTML = `
                        <p class="success">✅ Base de datos conectada</p>
                        <p>Total libros: ${data.total_libros}</p>
                        <p>Disponibles: ${data.libros_disponibles}</p>
                    `;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
