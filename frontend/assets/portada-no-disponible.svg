<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="200" height="300" fill="url(#grad1)"/>

  <!-- Borde -->
  <rect x="10" y="10" width="180" height="280" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Icono de libro -->
  <g transform="translate(100, 120)">
    <!-- Páginas -->
    <rect x="-30" y="-35" width="60" height="70" fill="white" opacity="0.9" rx="3"/>
    <line x1="-30" y1="-25" x2="30" y2="-25" stroke="#764ba2" stroke-width="1" opacity="0.3"/>
    <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#764ba2" stroke-width="1" opacity="0.3"/>
    <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#764ba2" stroke-width="1" opacity="0.3"/>
    <line x1="-30" y1="5" x2="30" y2="5" stroke="#764ba2" stroke-width="1" opacity="0.3"/>
    <line x1="-30" y1="15" x2="30" y2="15" stroke="#764ba2" stroke-width="1" opacity="0.3"/>
    <line x1="-30" y1="25" x2="20" y2="25" stroke="#764ba2" stroke-width="1" opacity="0.3"/>

    <!-- Icono de imagen no disponible -->
    <circle cx="0" cy="60" r="25" fill="white" opacity="0.8"/>
    <text x="0" y="73" font-family="Arial, sans-serif" font-size="30" fill="#764ba2" text-anchor="middle">📷</text>
  </g>

  <!-- Texto "Imagen no disponible" -->
  <text x="100" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Imagen no</text>
  <text x="100" y="238" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">disponible</text>

  <!-- Marca de agua -->
  <text x="100" y="280" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.5" text-anchor="middle">Bibliocusiana</text>
</svg>
